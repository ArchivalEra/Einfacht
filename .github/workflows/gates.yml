# 事实新鲜度与全部闸门的正面 CI 落点（issue #4 ②）：
# reflect-hooks/pre-commit / pre-push 只装在跑过 install.py 的机器上，
# 且可被 git push --no-verify 跳过 —— 只在自己方便时生效的闸门
# = 本仓最擅长的那种"从未跑过的闸门"。这里正面执行与本地 hook
# 同一条判据：facts --check（机器块 ↔ 台账）+ 发现式名录里的
# 全部闸门（check_facts_replay 含在内 ⇒ 台账每条 cmd 在 CI 里
# 真的被逐字执行）。闸门数目以发现式名录为准 —— 这里不写数字，
# 手写数字一定会漂。
name: gates

on:
  push: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 钉小版本 + check-latest（uTLS-Gone issue #4 的实战经验）：
      # runner 镜像缓存会滞后安全发布 —— 只写大版本（如 "3"）默认 check-latest: false，
      # 实测解析到旧镜像里打包的 patch；写大版本 ≠ 拿到修复版。显式钉小版本并强制
      # 解析最新 patch，让「CI 运行时」与「安全公告」对齐（issue #19 部署链真值漂移
      # 的一个具体实例：CI 配置是运行时版本的唯一产地，必须是被闸门看见的事实）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: true
      - name: 事实块与台账一致 + 发现式名录的全部闸门全绿
        run: |
          # 名录对账（缺声明 / 孤儿 / 旗标错 / 写而不跑的自证 / 幻影旋钮）
          python3 zreflect/registry.py --gates >/dev/null
          python3 zreflect/registry.py --selftest-modules >/dev/null
          # 不给文档名 ⇒ 查全部有机器块的文档（STATE + PRINCIPLES）：
          # 「唯二必须丈量的东西」少查一份，那份的「不要手改」就是空话。
          python3 zreflect/facts.py --check
          # 执行面唯一产地（C1）：跑 runs_at="commit" 的闸门，聚合 ran/off/failed
          # （off 不是通过 —— 输出里单列）。别再 glob check_*.py。
          python3 zreflect/registry.py --run commit
      - name: 全量自证（闸门 + 插件 + 平台模块 + 跨仓可配置性 + 端到端零语言）
        run: |
          # 唯一入口：zreflect/harness.py（原文是 gates-selftest.sh 那 287 行 shell，
          # 已全 Python 化 —— 跨平台，且它的文案走语言包，不再绕过零语言制度）。
          # 它自己会跑：每个闸门先证明能红 / 插件 / 平台模块 / 换名夹具 /
          # 未装语言包时零中文。
          python3 zreflect/harness.py
